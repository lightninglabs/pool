version: "2"
run:
  # If you change this please also update GO_VERSION in the Makefile.
  go: "1.27.3"

  # timeout for analysis
  timeout: 4m

linters:
  default: all
  disable:
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    # v2 rename of exhaustruct; keep the existing decision.
    - exhaustruct_v5
    - forbidigo
    - forcetypeassert
    - funlen
    # New in golangci-lint v2; these need code adjustments first and are
    # tracked separately from this toolchain bump.
    - funcorder
    - modernize
    - noinlineerr
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    # Superseded by gomodguard_v2, enabled below.
    - gomodguard
    - godox
    - gomoddirectives
    - gosmopolitan
    - inamedparam
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - maintidx
    - mnd
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - promlinter
    - protogetter
    - revive
    - tagalign
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    # v2 rename of wsl; keep the existing decision.
    - wsl_v5
  enable:
    # v2 rename of gomodguard, which was active before the migration.
    - gomodguard_v2
  settings:
    gosec:
      excludes:
        - G402
        - G306
        - G601
        - G115
    staticcheck:
      checks:
        - "S*"
    tagliatelle:
      case:
        rules:
          json: snake
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  new-from-rev: c5b37702e0bead2408ba72aad792ea4ff9fc930f
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
